<!DOCTYPE html><html><head><meta charset="UTF-8"><title>v</title>
<style>html,body{margin:0}iframe{width:1200px;height:700px;border:0}</style></head><body>
<iframe id="f" src="index.html"></iframe><pre id="o">…</pre>
<script>
const errs=[], L=[], ok=(n,c,x)=>L.push((c?'  OK  ':'  실패 ')+n+(x?'  '+x:''));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
document.getElementById('f').addEventListener('load',async function(){
 const d=this.contentDocument,w=this.contentWindow;
 w.addEventListener('error',e=>errs.push('JS 오류: '+e.message));
 const ce=w.console.error; w.console.error=function(){errs.push('error: '+[...arguments].join(' '));ce.apply(w.console,arguments)};
 const cw=w.console.warn;  w.console.warn=function(){errs.push('warn: '+[...arguments].join(' '));cw.apply(w.console,arguments)};
 try{
  await wait(2600);
  const one=s=>d.querySelector(s), q=s=>d.querySelectorAll(s).length;
  L.push('[전환 흔적 없음]');
  ok('HansuMode 전역 없음', typeof w.HansuMode==='undefined');
  ok('html data-mode 없음', !d.documentElement.hasAttribute('data-mode'));
  ok('data-kid 남은 요소 없음', q('[data-kid]')===0);

  L.push(''); L.push('[동작]');
  const tab=[...d.querySelectorAll('.course-tab')].find(b=>b.dataset.course==='naksan');
  tab.click(); await wait(150);
  ok('코스 선택', q('.hs-wall-fill.is-dim')===6 && q('.stamp')===3);
  d.querySelectorAll('.course-tab')[0].click(); await wait(120);

  w.navigator.geolocation.getCurrentPosition=cb=>cb({coords:{latitude:37.5960,longitude:126.9812,accuracy:11}});
  one('#checkinBtn').click(); await wait(400);
  ok('스탬프 인증', one('#checkinStatus').classList.contains('ok'), one('#checkinStatus').textContent.slice(0,26));
  ok('이야기 어린이 문구', /이에요|예요|어요/.test(one('#storyPanel').textContent),
     one('#storyPanel p').textContent.slice(0,34));

  const ALL=w.HANSU_DATA.quiz;
  for(let i=0;i<6;i++){
    const qt=one('#quizQ').textContent.trim(), src=ALL.find(x=>x.q.trim()===qt);
    const opts=[...d.querySelectorAll('.quiz-opt')].map(o=>o.textContent.replace(/^[가나다라]/,'').trim());
    d.querySelectorAll('.quiz-opt')[opts.indexOf(src.options[src.answer])].click(); await wait(50);
    one('#quizNext').click(); await wait(50);
  }
  ok('퀴즈 만점', one('.qr-score').textContent==='6/6');
  one('#deckNext').click(); await wait(80);
  ok('이야기 카드 넘김', !!one('.deck-card h4'));
  ok('카드 본문 어린이 문구', /어요|에요|예요/.test(one('.deck-card p').textContent),
     one('.deck-card p').textContent.slice(0,30));

  L.push(''); L.push('[콘솔]');
  L.push(errs.length? errs.map(e=>'  '+e).join('\n') : '  오류·경고 없음');
 }catch(e){ L.push('  예외: '+e.message); }
 document.getElementById('o').textContent=L.join('\n');
});
</script></body></html>
